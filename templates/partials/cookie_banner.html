<aside
  class="cookie-banner"
  id="cookie-banner"
  role="region"
  aria-labelledby="cookie-banner-title"
  aria-describedby="cookie-banner-text"
>
  <div class="cookie-banner__inner">
    <div class="cookie-banner__copy">
      <p class="cookie-banner__title" id="cookie-banner-title">Файли cookie</p>
      <p class="cookie-banner__text" id="cookie-banner-text">
        Сайт збирає cookie для роботи сторінок і збереження вашої згоди.
        Деталі — у
        <a href="{% url 'privacy' %}">політиці конфіденційності</a>.
      </p>
    </div>
    <form
      class="cookie-banner__form"
      method="post"
      action="{% url 'cookie_consent' %}"
      data-cookie-form
    >
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <div class="cookie-banner__actions">
        <button class="btn btn--ghost" type="submit" name="choice" value="declined">
          Відмовитись
        </button>
        <button class="btn btn--primary" type="submit" name="choice" value="accepted">
          Погоджуюсь
        </button>
      </div>
      <p class="cookie-banner__error" data-cookie-error hidden role="alert"></p>
    </form>
  </div>
</aside>
