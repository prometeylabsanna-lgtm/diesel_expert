{% load static %}
<header class="header" role="banner">
  <div class="wrap">
    <div class="header__bar">
      <a class="header__brand" href="{% if request.resolver_match.url_name == 'home' %}#top{% else %}{% url 'home' %}{% endif %}">
        <img class="header__logo" src="{{ settings.logo_url }}" alt="Diesel Expert" width="91" height="79">
        <span class="header__divider" aria-hidden="true"></span>
        <span class="header__address">
          {% for line in settings.address_lines %}
            <span>{{ line }}</span>
          {% endfor %}
        </span>
      </a>
      <nav class="header__nav" aria-label="Головне меню">
        {% for item in nav %}
          <a class="header__link" href="{{ item.url }}">{{ item.label }}</a>
        {% endfor %}
      </nav>
      <div class="header__tools">
        <a class="header__phone" href="{{ settings.phone_href }}">
          <img src="{% static 'img/icons/phone.svg' %}" alt="" width="20" height="20">
          <span>{{ settings.phone }}</span>
        </a>
        <button class="btn btn--primary header__cta" type="button" data-modal-open="booking">
          <span>{{ settings.cta_service }}</span>
          <img class="icon" src="{% static 'img/icons/calendar.svg' %}" alt="" width="22" height="22">
        </button>
        <button class="header__burger" type="button" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="Меню">
          <img src="{% static 'img/icons/burger.svg' %}" alt="" width="24" height="24">
        </button>
      </div>
    </div>
  </div>
</header>
