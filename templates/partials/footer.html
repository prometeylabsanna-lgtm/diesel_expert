{% load static %}
<footer class="footer" id="contacts" role="contentinfo">
  <div class="wrap footer__inner">
    <div class="footer__top">
      <div class="footer__brand">
        <a href="#top">
          <img class="footer__logo" src="{% static settings.logo %}" alt="Diesel Expert" width="192" height="166">
        </a>
        <span class="footer__divider" aria-hidden="true"></span>
        <p class="footer__brand-address">
          {% for line in settings.address_lines %}
            <span>{{ line }}</span>
          {% endfor %}
        </p>
      </div>
      <div class="footer__cols">
        <div class="footer__info">
          <p class="footer__schedule">{{ settings.schedule }}</p>
          <p class="footer__address">
            {% for line in settings.address_lines %}
              <span>{{ line }}</span>
            {% endfor %}
          </p>
        </div>
      </div>
    </div>
    <div class="footer__bar">
      <p>{{ settings.copyright }}</p>
      <p>{{ settings.design_credit }}</p>
    </div>
  </div>
</footer>
