{% load static %}
<section class="section reviews" id="reviews" aria-labelledby="reviews-title">
  <div class="wrap">
    <div class="slider" data-slider>
      <div class="slider__head">
        <h2 class="section__title" id="reviews-title">{{ reviews.title }}</h2>
        <div class="slider__nav">
          <button class="slider__btn" type="button" data-slider-prev aria-label="Попередній">
            <img class="icon" src="{% static 'img/icons/chevron.svg' %}" alt="" width="24" height="24">
          </button>
          <button class="slider__btn" type="button" data-slider-next aria-label="Наступний">
            <img class="icon icon--flip" src="{% static 'img/icons/chevron.svg' %}" alt="" width="24" height="24">
          </button>
        </div>
      </div>
      <div class="slider__viewport" data-slider-viewport>
        <ul class="slider__track">
          {% for review in reviews.items %}
            <li class="slider__slide">
              <article class="review-card">
                <p class="review-card__avatar" aria-hidden="true">{{ review.initial }}</p>
                <h3 class="review-card__name">{{ review.name }}</h3>
                <p class="review-card__text">{{ review.text }}</p>
              </article>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
