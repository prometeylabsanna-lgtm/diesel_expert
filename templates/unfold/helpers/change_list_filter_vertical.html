{% load admin_list i18n unfold landing_admin %}

{% with vertical_filters=cl|unfold_vertical_filters %}
{% if vertical_filters %}
<div id="changelist-filter" class="backdrop-blur-xs bg-base-900/20 flex inset-0 z-60 dark:bg-base-900/80 fixed" hx-preserve x-show="filterOpen">
    <div id="changelist-filter-close" class="grow" x-on:click="filterOpen = false"></div>
    <div class="bg-white flex m-4 overflow-hidden rounded-default shadow-xs w-80 dark:bg-base-800">
        <div class="grow h-full overflow-auto relative">
            <div class="flex flex-col h-full">
                <div class="flex flex-col grow gap-4 overflow-auto *:mb-0">
                    <div class="flex flex-col gap-4 px-3 py-2.5 *:mb-0">
                        {% for spec in vertical_filters %}
                            {% admin_list_filter cl spec %}
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endwith %}
