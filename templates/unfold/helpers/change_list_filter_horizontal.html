{% load admin_list unfold landing_admin %}

{% with horizontal_filters=cl|unfold_horizontal_filters %}
    {% if horizontal_filters|length > 0 %}
        <form method="get" class="de-filters-row" oninput="this.submit()">
            {% preserve_filters %}
            {% for spec in horizontal_filters %}
                <div class="de-filter">
                    {% admin_list_filter cl spec %}
                </div>
            {% endfor %}
        </form>
    {% endif %}
{% endwith %}
